<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <!-- Demo video scene 2:05–2:35. English labels; matches the narration in 데모-영상-시나리오.md (10-09). -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
    <style>
      .title { font-size: 44px; font-weight: 700; fill: #111; }
      .lane { font-size: 26px; font-weight: 600; fill: #555; letter-spacing: 0.04em; }
      .box { fill: #fff; stroke: #111; stroke-width: 2.5; }
      .rule { fill: #f2f2f2; stroke: #111; stroke-width: 2.5; }
      .model { fill: #fff; stroke: #111; stroke-width: 2.5; stroke-dasharray: 10 6; }
      .person { fill: #111; }
      .h { font-size: 28px; font-weight: 700; fill: #111; }
      .s { font-size: 21px; fill: #333; }
      .hw { font-size: 28px; font-weight: 700; fill: #fff; }
      .sw { font-size: 21px; fill: #ddd; }
      .tag { font-size: 18px; font-weight: 600; fill: #555; letter-spacing: 0.06em; }
      .line { stroke: #111; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .legend { font-size: 20px; fill: #333; }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="#fff"/>
  <text x="80" y="92" class="title">Trend Interpreter – rules decide, models write, people approve</text>

  <!-- Lane 1: building the dictionary -->
  <text x="80" y="170" class="lane">BUILDING THE DICTIONARY · team collection server, every few hours</text>

  <rect x="80" y="200" width="300" height="190" rx="10" class="box"/>
  <text x="104" y="246" class="h">Public signals</text>
  <text x="104" y="284" class="s">Short videos, search trends,</text>
  <text x="104" y="312" class="s">news, reference wikis</text>
  <text x="104" y="350" class="s">Community posts: counted,</text>
  <text x="104" y="376" class="s">never quoted</text>

  <rect x="450" y="200" width="300" height="190" rx="10" class="model"/>
  <text x="474" y="236" class="tag">MODEL · GEMMA 4</text>
  <text x="474" y="276" class="h">Drafts meanings</text>
  <text x="474" y="314" class="s">Classifies how each</text>
  <text x="474" y="342" class="s">term is used and its risk</text>

  <rect x="820" y="200" width="330" height="190" rx="10" class="rule"/>
  <text x="844" y="236" class="tag">RULES · CODE</text>
  <text x="844" y="276" class="h">Publish gate</text>
  <text x="844" y="314" class="s">Reference doc required</text>
  <text x="844" y="342" class="s">Risky words kept off lists</text>
  <text x="844" y="370" class="s">Lifecycle: rising / fading</text>

  <rect x="1220" y="200" width="300" height="190" rx="10" class="person"/>
  <text x="1244" y="236" class="tag" fill="#bbb" style="fill:#bbb">PERSON</text>
  <text x="1244" y="276" class="hw">Review queue</text>
  <text x="1244" y="314" class="sw">Anything uncertain waits</text>
  <text x="1244" y="342" class="sw">New versions, never</text>
  <text x="1244" y="370" class="sw">silent overwrites</text>

  <path d="M380,295 L446,295" class="line"/>
  <path d="M750,295 L816,295" class="line"/>
  <path d="M1150,295 L1216,295" class="line"/>

  <!-- Published store -->
  <rect x="1590" y="200" width="250" height="190" rx="10" class="box"/>
  <text x="1614" y="236" class="tag">GOOGLE CLOUD</text>
  <text x="1614" y="276" class="h">Cloud SQL</text>
  <text x="1614" y="314" class="s">Verified dictionary,</text>
  <text x="1614" y="342" class="s">evidence, versions</text>
  <text x="1614" y="370" class="s">via Cloud Storage</text>
  <path d="M1520,295 L1586,295" class="line"/>

  <!-- Lane 2: request time -->
  <text x="80" y="500" class="lane">ONE PRODUCT → LOCAL COPY PER MARKET · Cloud Run (web + private API)</text>

  <rect x="80" y="570" width="260" height="200" rx="10" class="box"/>
  <text x="104" y="616" class="h">Marketer</text>
  <text x="104" y="654" class="s">Product photo +</text>
  <text x="104" y="682" class="s">one line, markets</text>

  <rect x="400" y="570" width="300" height="200" rx="10" class="rule"/>
  <text x="424" y="606" class="tag">1 · RULES</text>
  <text x="424" y="646" class="h">Pick the meme</text>
  <text x="424" y="684" class="s">Ranks verified words in use</text>
  <text x="424" y="712" class="s">by fit, spread, lifecycle, risk</text>
  <text x="424" y="740" class="s">Shows why and left-outs</text>

  <rect x="760" y="570" width="300" height="200" rx="10" class="model"/>
  <text x="784" y="606" class="tag">2 · MODEL · GEMINI</text>
  <text x="784" y="646" class="h">Write the copy</text>
  <text x="784" y="684" class="s">Reads the product photo</text>
  <text x="784" y="712" class="s">4 lines in the market's</text>
  <text x="784" y="740" class="s">language</text>

  <rect x="1120" y="570" width="300" height="200" rx="10" class="rule"/>
  <text x="1144" y="606" class="tag">3 · RULES</text>
  <text x="1144" y="646" class="h">Check every line</text>
  <text x="1144" y="684" class="s">Meme actually used?</text>
  <text x="1144" y="712" class="s">Clean? Fits the length?</text>
  <text x="1144" y="740" class="s">Failed lines: redo or drop</text>

  <rect x="1480" y="570" width="360" height="200" rx="10" class="person"/>
  <text x="1504" y="606" class="tag" style="fill:#bbb">4 · PERSON</text>
  <text x="1504" y="646" class="hw">Approve</text>
  <text x="1504" y="684" class="sw">Nothing goes out unapproved</text>
  <text x="1504" y="712" class="sw">Recorded with the</text>
  <text x="1504" y="740" class="sw">reviewer's name</text>

  <path d="M340,670 L396,670" class="line"/>
  <path d="M700,670 L756,670" class="line"/>
  <path d="M1060,670 L1116,670" class="line"/>
  <path d="M1420,670 L1476,670" class="line"/>

  <!-- dictionary feeds request time -->
  <path d="M1715,390 L1715,520 L550,520 L550,566" class="line"/>
  <text x="1120" y="550" class="s">reads only the published dictionary</text>

  <!-- footer -->
  <rect x="80" y="840" width="1760" height="1.5" fill="#ccc"/>
  <rect x="80" y="880" width="44" height="30" rx="5" class="rule"/>
  <text x="138" y="903" class="legend">Rules: deterministic code decides status, risk and ranking</text>
  <rect x="80" y="930" width="44" height="30" rx="5" class="model"/>
  <text x="138" y="953" class="legend">Models only write and classify; their output is checked by rules</text>
  <rect x="80" y="980" width="44" height="30" rx="5" class="person"/>
  <text x="138" y="1003" class="legend">People approve what goes out</text>
  <text x="1100" y="903" class="legend">Cloud Run · Cloud SQL · Cloud Storage · Vertex AI (Gemini)</text>
  <text x="1100" y="953" class="legend">Gemini under a monthly spending cap · no API keys</text>
  <text x="1100" y="1003" class="legend">Logs never hold user text or generated copy</text>
</svg>
