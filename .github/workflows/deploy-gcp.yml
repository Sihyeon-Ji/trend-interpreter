name: Deploy GCP
on:
  push:
    branches: [release/gcp]
permissions:
  contents: read
concurrency:
  group: release-gcp
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: gcp
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: stunning-crane-508614-c1
      REGION: asia-northeast3
      SERVICE: builder-cup
      IMAGE: asia-northeast3-docker.pkg.dev/stunning-crane-508614-c1/builder-cup/app
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: docker/setup-buildx-action@v3
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy candidate, verify, then promote
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: bash scripts/deploy-gcp.sh "$IMAGE@$IMAGE_DIGEST"
