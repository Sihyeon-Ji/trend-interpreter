name: Deploy GCP
on:
  push:
    branches: [release/gcp]
    paths:
      - .dockerignore
      - .github/workflows/deploy-gcp.yml
      - apps/api/**
      - apps/web/**
      - Dockerfile
      - pyproject.toml
      - scripts/deploy-gcp.sh
      - uv.lock
permissions:
  contents: read
concurrency:
  group: release-gcp
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: gcp
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: stunning-crane-508614-c1
      REGION: asia-northeast1
      SERVICE: builder-cup
      IMAGE: asia-northeast1-docker.pkg.dev/stunning-crane-508614-c1/builder-cup/app
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: image
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy candidate, verify, then promote
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: bash scripts/deploy-gcp.sh "$IMAGE@$IMAGE_DIGEST"
