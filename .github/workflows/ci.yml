name: CI
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose run --rm --build check
      - run: docker compose run --rm --build audit-check
      - run: docker compose run --rm --build gateway-check
      - run: docker compose run --rm security-check
      - run: docker compose up -d --build --wait
      - run: docker compose run --build -e PLAYWRIGHT_OUTPUT_DIR=/tmp/test-results --name builder-cup-e2e e2e
      - run: docker compose run --rm infra-check
      - run: docker build -t builder-cup-trend-api:ci apps/trend-api
      - run: docker build -t builder-cup-trend-web:ci apps/trend-web
      - run: bash scripts/container-smoke.sh builder-cup-trend-api:ci builder-cup-trend-web:ci
      - run: docker build -f apps/alert-relay/Dockerfile -t builder-cup-alert-relay:ci .
      - run: bash scripts/alert-relay-smoke.sh builder-cup-alert-relay:ci
      - name: Collect browser failure artifacts
        if: failure()
        run: docker cp builder-cup-e2e:/tmp/test-results ./browser-test-results || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: browser-failure
          path: browser-test-results/
          retention-days: 7
      - name: Stop development services
        if: always()
        run: docker compose down --remove-orphans
