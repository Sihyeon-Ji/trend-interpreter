services:
  app:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      MODEL_PROVIDER: mock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
