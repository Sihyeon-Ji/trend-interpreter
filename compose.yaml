# Run from the repository root. Command guide (Korean) is in docs/commands.md.
# Start development with docker compose up -d, then open http://localhost:5173.
# Source edits reload automatically; dependency changes need docker compose up -d --build.
# Run application checks with docker compose run --rm --build check.
# Run browser tests with docker compose run --rm --build e2e.
# Stop development with docker compose down.
x-development: &development
  build:
    context: .
    dockerfile: Dockerfile.dev
    target: development
  init: true
  environment: &development-environment
    MODEL_PROVIDER: mock
    DEMO_API_KEY: ""
  volumes:
    - ./apps/api/src:/workspace/apps/api/src:ro
    - ./apps/web/src:/workspace/apps/web/src:ro
    - ./apps/web/index.html:/workspace/apps/web/index.html:ro
    - ./apps/web/vite.config.ts:/workspace/apps/web/vite.config.ts:ro
    - ./apps/web/tsconfig.json:/workspace/apps/web/tsconfig.json:ro
    - ./apps/web/playwright.config.ts:/workspace/apps/web/playwright.config.ts:ro
    - ./apps/web/e2e:/workspace/apps/web/e2e:ro
    - ./tests:/workspace/tests:ro
    - ./scripts:/workspace/scripts:ro
    - ./evaluation-cases:/workspace/evaluation-cases:ro

services:
  # Local passwords are generated once and kept in volumes, never in Git.
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: builder_cup
      POSTGRES_DB: builder_cup
      POSTGRES_PASSWORD_FILE: /run/db-admin/password
    entrypoint: [bash, -ec]
    command:
      - |
        umask 077
        for directory in /run/db-admin /run/db-app; do
          if [ ! -s "$$directory/password" ]; then
            od -An -N32 -tx1 /dev/urandom | tr -d ' \n' > "$$directory/password"
          fi
        done
        umask 022
        exec docker-entrypoint.sh postgres
    volumes:
      - postgres_data:/var/lib/postgresql
      - postgres_admin_password:/run/db-admin
      - postgres_app_password:/run/db-app
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, builder_cup, -d, builder_cup]
      interval: 2s
      timeout: 5s
      retries: 30

  # Idempotent initial lab schema and restricted application role.
  db-init:
    <<: *development
    command: python scripts/db_lab.py init
    environment:
      DATABASE_PASSWORD_FILE: /run/db-app/password
      DATABASE_ADMIN_PASSWORD_FILE: /run/db-admin/password
    volumes:
      - ./apps/api/src:/workspace/apps/api/src:ro
      - ./scripts:/workspace/scripts:ro
      - postgres_admin_password:/run/db-admin:ro
      - postgres_app_password:/run/db-app:ro
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *development
    command: uvicorn builder_cup.main:create_app --factory --reload --reload-dir apps/api/src --host 0.0.0.0 --port 8000
    ports: ["127.0.0.1:${DEV_API_PORT:-8000}:8000"]
    environment:
      <<: *development-environment
      WATCHFILES_FORCE_POLLING: "true"
      DATABASE_LAB_ENABLED: "true"
      WORKFLOW_LAB_ENABLED: "true"
      DATABASE_PASSWORD_FILE: /run/db-app/password
    volumes:
      - ./apps/api/src:/workspace/apps/api/src:ro
      - ./tests:/workspace/tests:ro
      - ./scripts:/workspace/scripts:ro
      - ./evaluation-cases:/workspace/evaluation-cases:ro
      - postgres_app_password:/run/db-app:ro
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 2s
      timeout: 5s
      retries: 15

  web:
    <<: *development
    command: npm --prefix apps/web run dev -- --host 0.0.0.0 --port 5173 --strictPort
    ports: ["127.0.0.1:${DEV_WEB_PORT:-5173}:5173"]
    environment:
      <<: *development-environment
      API_PROXY_TARGET: http://api:8000
      VITE_USE_POLLING: "true"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 15

  # One-off validation; excluded from the default startup by the tools profile.
  # Read-only probes do not start dependencies, initialize the DB or run inference.
  doctor:
    <<: *development
    profiles: [tools]
    command: python scripts/doctor.py
    read_only: true
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./compose.yaml:/checkout/compose.yaml:ro
      - ./pyproject.toml:/checkout/pyproject.toml:ro

  # Application checks can run without development services.
  check:
    <<: *development
    profiles: [tools]
    command:
      - sh
      - -c
      - >-
        ruff check apps/api tests scripts &&
        ruff format --check apps/api tests scripts &&
        mypy && pytest -q &&
        python scripts/evaluate.py &&
        npm --prefix apps/web run typecheck &&
        npm --prefix apps/web run build

  # Browser tests start the development services they depend on.
  e2e:
    <<: *development
    profiles: [tools]
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: browser-tests
    command: npm --prefix apps/web run test:e2e
    shm_size: 1gb
    environment:
      <<: *development-environment
      PLAYWRIGHT_BASE_URL: http://web:5173
    depends_on:
      web:
        condition: service_healthy

  # Create/read a synthetic record through the API, or read a previous ID after a DB restart.
  db-check:
    <<: *development
    profiles: [tools]
    entrypoint: [python, scripts/db_lab.py]
    command: [check]
    environment:
      <<: *development-environment
      DEV_API_PORT: ${DEV_API_PORT:-8000}
    depends_on:
      api:
        condition: service_healthy

  # Run synthetic documents through input validation, fan-out, join and rule-based routing.
  workflow-check:
    <<: *development
    profiles: [tools]
    command: python scripts/workflow_lab.py
    depends_on:
      api:
        condition: service_healthy

  # Verify persisted metadata, or supply an existing run ID to read it again.
  history-check:
    <<: *development
    profiles: [tools]
    entrypoint: [python, scripts/history_lab.py]
    command: []
    depends_on:
      api:
        condition: service_healthy

  # Reproduce bounded Mock failures and recovery; optionally supply one scenario name.
  failure-check:
    <<: *development
    profiles: [tools]
    entrypoint: [python, scripts/failure_lab.py]
    command: [all]
    depends_on:
      api:
        condition: service_healthy

  # Explicit local inference only; results persist on the host and never run in CI.
  ollama-check:
    <<: *development
    profiles: [tools]
    command: python scripts/ollama_lab.py
    environment:
      MODEL_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: gemma4:e4b
      MODEL_TIMEOUT_SECONDS: "120"
      MODEL_MAX_ATTEMPTS: "1"
      SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
      SOURCE_DIRTY: ${SOURCE_DIRTY:-unknown}
    volumes:
      - ./apps/api/src:/workspace/apps/api/src:ro
      - ./scripts:/workspace/scripts:ro
      - ./evaluation-cases:/workspace/evaluation-cases:ro
      - ./artifacts:/workspace/artifacts

  # Validate suites, manual reviews and report comparisons without model calls.
  model-eval:
    <<: *development
    profiles: [tools]
    entrypoint: [python, scripts/model_eval.py]
    command: [validate-suite]
    volumes:
      - ./apps/api/src:/workspace/apps/api/src:ro
      - ./scripts:/workspace/scripts:ro
      - ./evaluation-cases:/workspace/evaluation-cases:ro
      - ./artifacts:/workspace/artifacts

  # Explicit Gemma 4 run with metadata-only PostgreSQL history; the default API stays Mock.
  ollama-history-check:
    <<: *development
    profiles: [tools]
    entrypoint: [python, scripts/ollama_history_lab.py]
    command: [meeting]
    environment:
      MODEL_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: gemma4:e4b
      MODEL_TIMEOUT_SECONDS: "120"
      MODEL_MAX_ATTEMPTS: "1"
      DATABASE_LAB_ENABLED: "true"
      WORKFLOW_LAB_ENABLED: "true"
      DATABASE_PASSWORD_FILE: /run/db-app/password
      SOURCE_COMMIT: ${SOURCE_COMMIT:-unknown}
      SOURCE_DIRTY: ${SOURCE_DIRTY:-unknown}
    volumes:
      - ./apps/api/src:/workspace/apps/api/src:ro
      - ./scripts:/workspace/scripts:ro
      - ./evaluation-cases:/workspace/evaluation-cases:ro
      - ./artifacts:/workspace/artifacts
      - postgres_app_password:/run/db-app:ro
    depends_on:
      db-init:
        condition: service_completed_successfully

  # Dependency tools write manifests and lockfiles back to the checkout without installing locally.
  npm:
    profiles: [tools]
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: tooling
    working_dir: /workspace/apps/web
    entrypoint: [npm]
    command: [--help]
    environment:
      NPM_CONFIG_PACKAGE_LOCK_ONLY: "true"
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
    volumes:
      - ./apps/web:/workspace/apps/web

  uv:
    profiles: [tools]
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: tooling
    entrypoint: [uv]
    command: [--help]
    environment:
      UV_NO_SYNC: "true"
      UV_PROJECT_ENVIRONMENT: /tmp/dependency-venv
    volumes:
      - .:/workspace

  # Local validation only, without cloud credentials or resource provisioning.
  infra-check:
    profiles: [tools]
    image: hashicorp/terraform:1.16.3
    working_dir: /infra
    volumes:
      - ./infra/gcp:/infra:ro
    environment:
      TF_DATA_DIR: /tmp/terraform
    entrypoint: [sh, -c]
    command:
      - terraform fmt -check && terraform init -backend=false -lockfile=readonly && terraform validate

  # Production-style mock preview on port 8080, without source reload.
  # Start with docker compose up -d --build preview; stop with docker compose stop preview.
  preview:
    profiles: [preview]
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      MODEL_PROVIDER: mock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  postgres_admin_password:
  postgres_app_password:
