# Run from the repository root. Plain `docker compose up -d` starts PostgreSQL, the trend API and the web.
# Source edits reload automatically. Rebuild after manifest, lockfile or Dockerfile changes.
# The database credentials below are for the loopback-only development stack; the port is not published.
x-development: &development
  build:
    context: .
    dockerfile: Dockerfile.dev
    target: development
  init: true

x-database-url: &database_url postgresql://trend:trend@db:5432/trend
# Not a secret: a fixed session key for the loopback-only development stack, so the admin e2e specs can sign a reviewer cookie.
# The development web has no FRONTEND_API_TOKEN, so an admin session here cannot write to the API.
x-dev-session-secret: &dev_session_secret dev-only-session-secret-not-a-secret

services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: trend
      POSTGRES_PASSWORD: trend
      POSTGRES_DB: trend
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U trend -d trend]
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    <<: *development
    working_dir: /workspace/apps/trend-api
    command: uvicorn trend_agents.api.app:app --reload --reload-dir src --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: *database_url
      MODEL_PROVIDER: mock
      MODEL_REQUESTS_ENABLED: "false"
      API_PORT: "8000"
      WEB_ORIGINS: http://localhost:3000
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "127.0.0.1:${DEV_API_PORT:-8000}:8000"
    volumes:
      - ./apps/trend-api/src:/workspace/apps/trend-api/src:ro
      - ./apps/trend-api/scripts:/workspace/apps/trend-api/scripts:ro
      - trend_data:/workspace/apps/trend-api/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 3s
      timeout: 5s
      retries: 20

  web:
    <<: *development
    working_dir: /workspace/apps/trend-web
    command: corepack pnpm dev --hostname 0.0.0.0 --port 3000
    environment:
      DATA_MODE: ${DATA_MODE:-sample}
      TREND_API_URL: http://api:8000
      WATCHPACK_POLLING: "true"
      SESSION_SECRET: *dev_session_secret
    ports:
      - "127.0.0.1:${DEV_WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/trend-web/app:/workspace/apps/trend-web/app:ro
      - ./apps/trend-web/components:/workspace/apps/trend-web/components:ro
      - ./apps/trend-web/lib:/workspace/apps/trend-web/lib:ro
      - ./apps/trend-web/public:/workspace/apps/trend-web/public:ro
      - ./apps/trend-web/proxy.ts:/workspace/apps/trend-web/proxy.ts:ro
      - ./apps/trend-web/next.config.ts:/workspace/apps/trend-web/next.config.ts:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 20

  check:
    <<: *development
    profiles: [tools]
    environment:
      PYTHONPATH: /workspace
      DATABASE_URL: *database_url
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        UV_PROJECT_ENVIRONMENT=/opt/data-tools-venv uv run --offline --project . --locked pytest -q tests/test_snapshot.py tests/test_dvc_reproduction.py
        uv run --offline --project apps/trend-api --locked pytest -q apps/trend-api/tests
        uv run --offline --project apps/trend-api --locked pytest -q tests/test_release_scope.py tests/test_release_recovery.py tests/test_verify_alert_delivery.py tests/test_deploy_safety.py tests/test_prepare_audit_review.py
        UV_PROJECT_ENVIRONMENT=/opt/alert-relay-venv uv run --offline --project apps/alert-relay --locked pytest -q apps/alert-relay/tests
        cd apps/trend-web
        corepack pnpm test:unit
        corepack pnpm lint
        corepack pnpm build

  e2e:
    <<: *development
    profiles: [tools]
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: browser-tests
    working_dir: /workspace/apps/trend-web
    command: corepack pnpm test:e2e
    shm_size: 1gb
    environment:
      PLAYWRIGHT_BASE_URL: http://web:3000
      PLAYWRIGHT_SESSION_SECRET: *dev_session_secret
    depends_on:
      web:
        condition: service_healthy

  # Only the selected application lockfiles are audited; other prototypes stay separate.
  security-check:
    image: ghcr.io/google/osv-scanner:v2.6.0@sha256:afd838850ac1a0fcc15ff4a041dc9ba11123c3f0d2666217a5f0fcf9222b55fa
    profiles: [tools]
    working_dir: /src
    read_only: true
    volumes:
      - ./:/src:ro
    command:
      - scan
      - source
      - --lockfile=/src/apps/trend-api/uv.lock
      - --lockfile=/src/apps/alert-relay/uv.lock
      - --lockfile=/src/apps/trend-web/pnpm-lock.yaml
      - --verbosity=error

  audit-check:
    <<: *development
    profiles: [tools]
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: audit-tests
    working_dir: /workspace/models/kaggle/audit
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/audit-test-venv
    command: uv run --offline --locked --extra cpu pytest -q

  # Editable dependency commands write only the chosen project's manifest and lockfile.
  data-tools:
    <<: *development
    profiles: [tools]
    working_dir: /workspace
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/data-tools-venv
      PYTHONPATH: /workspace
    entrypoint: [uv, run, --offline, --locked]
    command: [python, scripts/snapshot.py, --help]
    volumes:
      - ./:/workspace

  uv:
    profiles: [tools]
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: tooling
    working_dir: /workspace/apps/trend-api
    entrypoint: [uv]
    command: [--help]
    volumes:
      - ./apps/trend-api:/workspace/apps/trend-api

  pnpm:
    profiles: [tools]
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: tooling
    working_dir: /workspace/apps/trend-web
    entrypoint: [corepack, pnpm]
    command: [--help]
    volumes:
      - ./apps/trend-web:/workspace/apps/trend-web

  infra-check:
    profiles: [tools]
    image: hashicorp/terraform:1.16.3
    working_dir: /infra
    volumes:
      - ./infra/gcp:/infra:ro
    environment:
      TF_DATA_DIR: /tmp/terraform
    entrypoint: [sh, -c]
    command:
      - terraform fmt -check && terraform init -backend=false -lockfile=readonly && terraform validate

volumes:
  postgres_data:
  trend_data:
