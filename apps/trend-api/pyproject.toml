[project]
name = "trend-agents"
version = "0.1.0"
description = "AI Builder Cup 2026 — 세대·국가 간 트렌드 수집·해석 에이전트 (feasibility stage)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "feedparser>=6.0.14",
    "google-adk>=2.9.0",
    "google-api-python-client>=2.200.0",
    "google-cloud-bigquery>=3.45.0",
    "google-cloud-spanner>=3.71.0",
    "google-genai>=2.23.0",
    "httpx>=0.28.1",
    "litellm>=1.84",
    "ollama>=0.6.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trend_agents"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
