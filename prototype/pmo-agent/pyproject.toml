# A standalone candidate project (everything under prototype/ carries its own dependencies — see the README).
# Tool settings match the repository root pyproject.toml: py312, line-length 100, ruff E/F/I/UP/B.
[project]
name = "pmo-agent"
version = "0.1.0"
description = "Code computes the schedule, Gemini judges and explains, writes wait for a person"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.9,<1",
  "pydantic>=2.7,<3",
]

# The calculation (schedule, capacity, signals) uses the standard library only.
# Everything here exists for the web layer; the block below is development tooling.
[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "pillow>=10,<12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pmo_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tools/ too: the accuracy measurement lives there and a test holds the README to it
pythonpath = ["src", "tests", "tools"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/pmo_agent"]
check_untyped_defs = true
