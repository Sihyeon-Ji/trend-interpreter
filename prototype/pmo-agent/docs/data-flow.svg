<!-- ================= test cases ================= -->
<rect x="40" y="560" width="1220" height="1" fill="#d3d8e2"/>
<text x="40" y="592" class="band">테스트 케이스 &#8212; 각 단계가 무엇을 증명하는가</text>
<text x="300" y="592" class="mono">python tools/evaluate.py --dates 13 &#183; 15/15 &#183; 488 unit tests</text>

<g>
  <rect x="40" y="606" width="290" height="176" rx="9" fill="#fff" stroke="#d3d8e2"/>
  <text x="58" y="630" class="tch">② 잇는다</text>
  <text x="58" y="652" class="tc">inference-declared</text>
  <text x="58" y="668" class="mono">추론한 연결은 추론이라고 말한다</text>
  <text x="58" y="690" class="tc">no-evidence-no-warning</text>
  <text x="58" y="706" class="mono">근거가 하나도 없으면 아무것도 잇지 않는다</text>
  <text x="58" y="728" class="tc">assist-stays-in-candidates</text>
  <text x="58" y="744" class="mono">모델은 후보 밖으로 못 나가고, 규칙이</text>
  <text x="58" y="758" class="mono">정한 연결을 못 뒤집는다</text>
</g>

<g>
  <rect x="348" y="606" width="290" height="176" rx="9" fill="#fff" stroke="#d3d8e2"/>
  <text x="366" y="630" class="tch">③ 계산한다 &#183; 일정</text>
  <text x="366" y="652" class="tc">root-cause-visible</text>
  <text x="366" y="668" class="mono">심어 둔 지연이 위험 목록에 나타난다</text>
  <text x="366" y="690" class="tc">meeting-overload-detected</text>
  <text x="366" y="706" class="mono">회의가 가장 많은 사람을 집어낸다</text>
  <text x="366" y="728" class="tc">no-calendar-no-meeting-claim</text>
  <text x="366" y="744" class="mono">달력이 없으면 회의 얘기를 하지 않는다</text>
  <text x="366" y="766" class="tc">cycle-is-error-not-crash</text>
</g>

<g>
  <rect x="656" y="606" width="290" height="176" rx="9" fill="#fff" stroke="#d3d8e2"/>
  <text x="674" y="630" class="tch">③ 계산한다 &#183; 신호와 원인</text>
  <text x="674" y="652" class="tc">stalled / undeclared-progress /</text>
  <text x="674" y="668" class="tc">premature-done</text>
  <text x="674" y="684" class="mono">심어 둔 보드 오류 3종을 찾아낸다</text>
  <text x="674" y="706" class="tc">cause-reaches-the-incident</text>
  <text x="674" y="722" class="mono">달력에서 사고까지 닿는다</text>
  <text x="674" y="744" class="tc">cause-quotes-the-written-decision</text>
  <text x="674" y="760" class="mono">키 없는 회의록을 추론으로 붙여 인용한다</text>
</g>

<g>
  <rect x="964" y="606" width="296" height="176" rx="9" fill="#fffaeb" stroke="#fbcf8a"/>
  <text x="982" y="630" class="tch">④ 멈춘다 &#183; 절제</text>
  <text x="982" y="652" class="tc">no-write-without-approval</text>
  <text x="982" y="668" class="mono">고른 게 없으면 호출이 0건이다</text>
  <text x="982" y="690" class="tc">invented-key-becomes-question</text>
  <text x="982" y="706" class="mono">없는 키는 반영이 아니라 질문이 된다</text>
  <text x="982" y="728" class="tc">cause-admits-the-unexplained</text>
  <text x="982" y="744" class="mono">설명 못 한 일수를 지어내지 않고</text>
  <text x="982" y="758" class="mono">그렇다고 적는다</text>
</g>

<!-- footer -->
<rect x="40" y="808" width="1220" height="1" fill="#d3d8e2"/>
<text x="40" y="838" class="io">
  <tspan font-weight="650" fill="#161b26">읽기 전용이 셋, 쓰기가 하나.</tspan>
  GitHub · Outlook · Notion 어댑터에는 쓰는 메서드가 아예 없다 &#8212; 있으면 안 된다가 아니라, 코드 경로가 없다.
</text>
<text x="40" y="862" class="io">
  <tspan font-weight="650" fill="#161b26">모델이 닿는 곳은 두 군데뿐.</tspan>
  자유 문장·사진을 읽는 ingest, 그리고 규칙이 침묵한 연결만 맡는 link_assist. 어느 쪽도 숫자를 만들지 않는다.
</text>
<text x="40" y="886" class="io">
  <tspan font-weight="650" fill="#161b26">모든 어댑터에 로컬 쌍둥이가 있다.</tspan>
  같은 Protocol 뒤에 JSON 구현이 있어서 계정 하나 없이 전체가 돌아간다 &#8212; 488개 테스트가 네트워크를 안 타는 이유.
</text>
<text x="40" y="910" class="io">
  <tspan font-weight="650" fill="#161b26">세계는 today 에서 다시 만들어진다.</tspan>
  그래서 평가를 13개 날짜에서 돌린다. 이번 주에만 맞는 규칙은 하루면 드러난다.
</text>
<text x="40" y="946" class="mono">src/pmo_agent/ &#183; adapters(8) · linking · schedule · capacity · availability · cause · signals · familiarity · ingest · approve · i18n</text>
</svg>
