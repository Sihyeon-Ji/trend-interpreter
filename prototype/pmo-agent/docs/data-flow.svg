<!-- ================= ③ compute ================= -->
<g>
  <rect x="644" y="118" width="300" height="118" rx="10" fill="#fff" stroke="#d3d8e2"/>
  <text x="662" y="142" class="h">schedule.py &#8594; capacity.py</text>
  <text x="662" y="162" class="lbl">IN</text>
  <text x="688" y="162" class="io">Task[] + 가용 비율</text>
  <text x="662" y="182" class="lbl">OUT</text>
  <text x="688" y="182" class="io">CPM 종료일 → 사람 제약 종료일 → 회의 반영</text>
  <text x="662" y="202" class="io">임계 경로 · 여유 · 지연 전파 · 병목</text>
  <text x="662" y="224" class="m2">모든 날짜가 여기서 나온다. 모델은 손대지 않는다</text>
</g>
<g>
  <rect x="644" y="248" width="300" height="106" rx="10" fill="#fff" stroke="#d3d8e2"/>
  <text x="662" y="272" class="h">signals.py</text>
  <text x="662" y="292" class="lbl">IN</text>
  <text x="688" y="292" class="io">Task[] + Link[] + PR[]</text>
  <text x="662" y="312" class="lbl">OUT</text>
  <text x="688" y="312" class="io">Mismatch{kind, detail, facts, evidence}</text>
  <text x="662" y="332" class="io">stalled · undeclared_progress · done_with_open_pr</text>
  <text x="662" y="348" class="m2">보드가 말하는 것과 코드가 말하는 것의 차이</text>
</g>
<g>
  <rect x="644" y="366" width="300" height="154" rx="10" fill="#fff" stroke="#3557d8" stroke-width="1.5"/>
  <text x="662" y="390" class="h">cause.py</text>
  <text x="662" y="408" class="io">왜 멈췄나 &#8212; 네 도구가 동시에 필요한 유일한 답</text>
  <rect x="662" y="418" width="264" height="1" fill="#e5e8ee"/>
  <text x="662" y="438" class="lbl">IN</text>
  <text x="688" y="438" class="io">Link[] + Event[] + Note[] + Task[]</text>
  <text x="662" y="458" class="lbl">OUT</text>
  <text x="688" y="458" class="io">Cause{kind, days, facts} + 설명된 일수</text>
  <text x="662" y="478" class="io">+ trace{흔적 있는 날 / 없는 날} + 겹침</text>
  <text x="662" y="500" class="m2">하루는 하루다. 원인을 더하지 않고 날짜별로 센다</text>
  <text x="662" y="514" class="m2">설명 못 한 몫은 채우지 않고 그렇다고 말한다</text>
</g>

