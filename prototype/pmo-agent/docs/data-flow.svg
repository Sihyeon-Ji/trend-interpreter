<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 1000" width="1300" height="1000" font-family="-apple-system, 'Segoe UI', 'Malgun Gothic', sans-serif">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#98a2b3"/>
  </marker>
  <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#6d3fc4"/>
  </marker>
  <style>
    .t   { font-size:19px; font-weight:650; fill:#161b26 }
    .sub { font-size:12.5px; fill:#8b94a6 }
    .band{ font-size:10.5px; font-weight:700; fill:#8b94a6; letter-spacing:1.4px }
    .h   { font-size:13.5px; font-weight:650; fill:#161b26 }
    .hw  { font-size:13.5px; font-weight:650; fill:#fff }
    .lbl { font-size:10px; font-weight:700; fill:#8b94a6; letter-spacing:.7px }
    .io  { font-size:11px; fill:#5b6475 }
    .mono{ font-size:10.5px; font-family:ui-monospace, Consolas, monospace; fill:#8b94a6 }
    .m2  { font-size:10.5px; font-family:ui-monospace, Consolas, monospace; fill:#3557d8 }
    .tc  { font-size:10.5px; fill:#5b6475 }
    .tch { font-size:11px; font-weight:650; fill:#161b26 }
  </style>
</defs>

<rect width="1300" height="1000" fill="#f6f7f9"/>

<text x="40" y="44" class="t">Echo PMO &#183; 데이터 흐름</text>
<text x="40" y="66" class="sub">네 도구에서 무엇이 들어와, 무엇으로 바뀌고, 무엇이 나가는가 &#183; 화살표 위 글자는 그 단계가 넘기는 데이터</text>

<!-- band labels -->
<text x="40"   y="104" class="band">① 읽는다 (읽기 전용)</text>
<text x="368"  y="104" class="band">② 잇는다</text>
<text x="646"  y="104" class="band">③ 계산한다</text>
<text x="1004" y="104" class="band">④ 답하고, 멈춘다</text>

<!-- ================= ① sources ================= -->
<g>
  <rect x="40" y="118" width="268" height="92" rx="9" fill="#fff" stroke="#d3d8e2"/>
  <circle cx="58" cy="140" r="4" fill="#0a7d55"/>
  <text x="70" y="144" class="h">Jira</text>
  <text x="272" y="144" class="mono" text-anchor="end">LIVE</text>
  <text x="56" y="164" class="lbl">IN</text>
  <text x="82" y="164" class="io">상태 · 담당 · 기한 · Blocks 의존</text>
  <text x="56" y="182" class="lbl">OUT</text>
  <text x="82" y="182" class="io">Task{key, status, assignee, duedate, deps}</text>
  <text x="56" y="200" class="m2">adapters/jira.py &#183; 유일하게 쓰기 가능</text>
</g>
<g>
  <rect x="40" y="222" width="268" height="92" rx="9" fill="#fff" stroke="#d3d8e2"/>
  <circle cx="58" cy="244" r="4" fill="#0a7d55"/>
  <text x="70" y="248" class="h">GitHub</text>
  <text x="272" y="248" class="mono" text-anchor="end">LIVE</text>
  <text x="56" y="268" class="lbl">IN</text>
  <text x="82" y="268" class="io">커밋 · PR · 바뀐 파일 경로</text>
  <text x="56" y="286" class="lbl">OUT</text>
  <text x="82" y="286" class="io">Commit{sha, date, author, message, files}</text>
  <text x="56" y="304" class="m2">티켓 키 없음 &#183; 그게 문제의 핵심</text>
</g>
<g>
  <rect x="40" y="326" width="268" height="92" rx="9" fill="#fbfcfd" stroke="#e5e8ee"/>
  <circle cx="58" cy="348" r="4" fill="#8b94a6"/>
  <text x="70" y="352" class="h">Outlook</text>
  <text x="272" y="352" class="mono" text-anchor="end">LOCAL</text>
  <text x="56" y="372" class="lbl">IN</text>
  <text x="82" y="372" class="io">사람별 회의 일정과 시간</text>
  <text x="56" y="390" class="lbl">OUT</text>
  <text x="82" y="390" class="io">Event{attendee, date, hours, title}</text>
  <text x="56" y="408" class="m2">Azure 앱 등록 필요 &#183; 아직 미검증</text>
</g>
<g>
  <rect x="40" y="430" width="268" height="92" rx="9" fill="#fff" stroke="#d3d8e2"/>
  <circle cx="58" cy="452" r="4" fill="#0a7d55"/>
  <text x="70" y="456" class="h">Notion</text>
  <text x="272" y="456" class="mono" text-anchor="end">LIVE</text>
  <text x="56" y="476" class="lbl">IN</text>
  <text x="82" y="476" class="io">회의록 본문 (문장, 키 없음)</text>
  <text x="56" y="494" class="lbl">OUT</text>
  <text x="82" y="494" class="io">Note{date, author, title, body}</text>
  <text x="56" y="512" class="m2">무엇이 결정됐는지 아는 유일한 곳</text>
</g>

