<!-- ================= ② linking ================= -->
<g>
  <rect x="368" y="212" width="248" height="164" rx="10" fill="#fff" stroke="#3557d8" stroke-width="1.5"/>
  <text x="386" y="238" class="h">linking.py</text>
  <text x="386" y="256" class="io">커밋 → 태스크, 키 없이</text>

  <rect x="386" y="268" width="212" height="1" fill="#e5e8ee"/>
  <text x="386" y="288" class="lbl">IN</text>
  <text x="412" y="288" class="io">Commit[] + Task[]</text>
  <text x="386" y="308" class="lbl">HOW</text>
  <text x="412" y="308" class="mono">작성자 .30 · 어휘 .35 · 경로 .20 · 시각 .15</text>
  <text x="386" y="326" class="lbl">OUT</text>
  <text x="412" y="326" class="io">Link{task, sha, confidence} 또는 unlinked</text>
  <text x="386" y="348" class="m2">1등이 2등을 못 이기면 잇지 않는다</text>
  <text x="386" y="364" class="m2">실측: precision 1.00 · recall 0.85 (8개 날짜)</text>
</g>
<g>
  <rect x="368" y="392" width="248" height="88" rx="10" fill="#fbfcfd" stroke="#e5e8ee"/>
  <text x="386" y="416" class="h">availability.py</text>
  <text x="386" y="436" class="lbl">IN</text>
  <text x="412" y="436" class="io">Event[]</text>
  <text x="386" y="456" class="lbl">OUT</text>
  <text x="412" y="456" class="io">{사람: 가용 비율 0~1}</text>
  <text x="386" y="472" class="m2">회의 시간 → 그날 쓸 수 있는 몫</text>
</g>

