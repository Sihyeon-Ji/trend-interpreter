<!-- ================= ④ answer & gate ================= -->
<g>
  <rect x="1000" y="118" width="260" height="104" rx="10" fill="#f6f2ff" stroke="#6d3fc4"/>
  <text x="1018" y="142" class="h">ingest.py + Gemini</text>
  <text x="1018" y="162" class="lbl">IN</text>
  <text x="1044" y="162" class="io">자유 문장 · 손글씨 사진</text>
  <text x="1018" y="182" class="lbl">OUT</text>
  <text x="1044" y="182" class="io">제안 또는 질문 (applied: false)</text>
  <text x="1018" y="204" class="m2">모델은 읽고 고른다. 숫자는 만들지 않는다</text>
</g>
<g>
  <rect x="1000" y="234" width="260" height="128" rx="10" fill="#fff" stroke="#d3d8e2"/>
  <text x="1018" y="258" class="h">답</text>
  <text x="1018" y="278" class="io">달성 가능한 종료일 + 그 차이</text>
  <text x="1018" y="296" class="io">위험 태스크와 그 이유</text>
  <text x="1018" y="314" class="io">보드 ↔ 코드 불일치 + 근거 링크</text>
  <text x="1018" y="332" class="io">왜 멈췄나 + 설명 못 한 일수</text>
  <text x="1018" y="352" class="m2">api.py &#183; 대시보드 &#183; 주간 리포트</text>
</g>
<g>
  <rect x="1000" y="374" width="260" height="146" rx="10" fill="#fffaeb" stroke="#fbcf8a" stroke-width="1.5"/>
  <text x="1018" y="398" class="h">approve.py &#8212; 유일한 쓰기 경로</text>
  <text x="1018" y="418" class="lbl">IN</text>
  <text x="1044" y="418" class="io">사람이 체크한 것만</text>
  <text x="1018" y="438" class="lbl">GATE</text>
  <text x="1050" y="438" class="io">confirm=true · WRITE_ALLOWLIST</text>
  <text x="1018" y="458" class="lbl">OUT</text>
  <text x="1044" y="458" class="io">Jira 쓰기 + 감사 로그</text>
  <text x="1018" y="482" class="m2">모델은 이 화살표에 닿을 수 없다</text>
  <text x="1018" y="498" class="m2">tools.py 에 approve=True 가 없다 (테스트가 확인)</text>
  <text x="1018" y="514" class="m2">허용 목록 밖 도메인은 프로세스를 못 나간다</text>
</g>
