# Run on a Linux NVIDIA GPU host. The Mac API uses an SSH tunnel to this host.
services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.19.1}
    restart: unless-stopped
    ports: ["127.0.0.1:8001:8000"]
    environment:
      HF_TOKEN: ${HF_TOKEN:?Set HF_TOKEN after accepting the Gemma model license}
      VLLM_API_KEY: ${VLLM_API_KEY:?Set a private VLLM_API_KEY}
    volumes: ["model-cache:/root/.cache/huggingface"]
    shm_size: "8gb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command:
      - --model
      - ${VLLM_MODEL:-google/gemma-4-E2B-it}
      - --served-model-name
      - ${VLLM_MODEL:-google/gemma-4-E2B-it}
      - --host
      - "0.0.0.0"
      - --max-model-len
      - "4096"
      - --max-num-seqs
      - "2"
      - --gpu-memory-utilization
      - "0.85"
      - --limit-mm-per-prompt
      - '{"image":0,"audio":0,"video":0}'
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s
volumes:
  model-cache:
