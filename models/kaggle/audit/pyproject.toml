[project]
name = "trend-audit-training"
version = "0.1.0"
description = "Reproducible text-only Gemma audit QLoRA training"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate==1.15.0",
    "datasets==5.0.1",
    "peft==0.21.2",
    "transformers==5.18.0",
]

[project.optional-dependencies]
cpu = ["torch==2.14.1"]
gpu = ["torch==2.14.1", "bitsandbytes==0.50.2"]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.uv]
package = false
conflicts = [[{extra = "cpu"}, {extra = "gpu"}]]

[tool.uv.sources]
torch = [
    {index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'"},
    {index = "pytorch-cu126", extra = "gpu", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'"},
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
